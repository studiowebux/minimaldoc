<!DOCTYPE html>
<html>
<head>
<style>
:root {
    --text-primary: #1a1a1a;
    --text-secondary: #666;
    --bg-hover: #f5f5f5;
}

.nav-section-header {
    width: 100%;
    background: none;
    border: 1px solid #ddd;
    padding: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    border-radius: 4px;
    transition: background-color 0.2s ease;
    text-align: left;
    margin-bottom: 10px;
}

.nav-section-header:hover {
    background-color: var(--bg-hover);
}

.nav-toggle-icon {
    flex-shrink: 0;
    display: inline-block;
    width: 1em;
    font-size: 0.7rem;
    margin-right: 0.5rem;
    transition: transform 0.15s ease;
    color: var(--text-secondary);
    line-height: 1;
}

.nav-item:not(.collapsed) .nav-toggle-icon {
    transform: rotate(90deg);
}

.nav-section {
    font-weight: 600;
    font-size: 0.9rem;
    text-transform: uppercase;
}

.collapsed .nav-list-nested {
    display: none;
}
</style>
</head>
<body>
<h2>Navigation Test</h2>

<div class="nav-item collapsed">
<button type="button" class="nav-section-header">
<span class="nav-toggle-icon">▶</span>
<span class="nav-section">Collapsed Section</span>
</button>
<ul class="nav-list-nested">
<li>Item 1</li>
<li>Item 2</li>
</ul>
</div>

<div class="nav-item">
<button type="button" class="nav-section-header">
<span class="nav-toggle-icon">▶</span>
<span class="nav-section">Expanded Section</span>
</button>
<ul class="nav-list-nested">
<li>Item 1</li>
<li>Item 2</li>
</ul>
</div>

<p>The arrow should be visible before each section title. Collapsed points right (▶), expanded points down (▼).</p>

<script>
document.querySelectorAll('.nav-section-header').forEach(btn => {
    btn.addEventListener('click', () => {
        btn.closest('.nav-item').classList.toggle('collapsed');
    });
});
</script>
</body>
</html>
