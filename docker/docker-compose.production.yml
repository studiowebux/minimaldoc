# MinimalDoc Server - Production Environment
# Usage: docker-compose -f docker/docker-compose.production.yml up -d
#
# Prerequisites:
#   1. Create .env.production with required secrets (see below)
#   2. Ensure web/public/templates/ exists before building
#
# Required .env.production variables:
#   AUTH_JWT_SECRET=<min 32 chars, generate with: openssl rand -base64 48>
#   POSTGRES_PASSWORD=<strong password>
#   DATABASE_URL=postgres://minimaldoc:<POSTGRES_PASSWORD>@db:5432/minimaldoc?sslmode=disable
#
# Optional .env.production variables:
#   SERVER_CORS_ORIGINS=https://yourdomain.com
#   EMAIL_PROVIDER=smtp
#   SMTP_HOST=smtp.example.com
#   SMTP_USER=user
#   SMTP_PASS=pass
#   EMAIL_FROM_ADDRESS=noreply@yourdomain.com
#   EMAIL_BASE_URL=https://yourdomain.com
#   BOOTSTRAP_TOKEN=<secret token for initial setup>

services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    ports:
      - "8080:8080"
      - "127.0.0.1:8090:8090"
    env_file:
      - .env.production
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      SERVER_ADMIN_PORT: "8090"
      SERVER_ENV: "production"
      DB_DRIVER: "postgres"
      AUTH_ENABLE_LOCAL: "true"
      AUTH_SECURE_COOKIES: "true"
      RATE_LIMIT_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    volumes:
      - uploads:/app/uploads
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: minimaldoc
      POSTGRES_DB: minimaldoc
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minimaldoc"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  uploads:
