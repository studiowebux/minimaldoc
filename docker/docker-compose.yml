# MinimalDoc Server - Development Environment
# Usage: cp docker/.env.example docker/.env && docker-compose -f docker/docker-compose.yml up

services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    ports:
      - "8080:8080"
    environment:
      # Server
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"

      # Database
      DB_DRIVER: "postgres"
      DATABASE_URL: "postgres://minimaldoc:minimaldoc@db:5432/minimaldoc?sslmode=disable"

      # Auth — MUST be set in .env file (see .env.example)
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET}"
      AUTH_ENABLE_LOCAL: "true"
      AUTH_ENABLE_OAUTH: "false"

      # Email (mock for development)
      EMAIL_PROVIDER: "mock"

      # AI (disabled by default)
      AI_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: minimaldoc
      POSTGRES_PASSWORD: minimaldoc
      POSTGRES_DB: minimaldoc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minimaldoc"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
    restart: unless-stopped

  # Optional: Mailhog for email testing
  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    profiles:
      - email

volumes:
  pgdata:
