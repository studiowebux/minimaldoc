{{define "landing-scripts" -}}
<script defer src="{{.BasePath}}/js/theme-toggle.js?v={{.Version}}"></script>
<script>
(function(){
    var toggle = document.getElementById('landing-menu-toggle');
    var nav = document.getElementById('landing-nav');
    var backdrop = document.getElementById('landing-nav-backdrop');
    if (!toggle || !nav || !backdrop) return;

    function open() {
        nav.classList.add('open');
        backdrop.classList.add('open');
        toggle.classList.add('open');
        toggle.setAttribute('aria-expanded', 'true');
        document.body.style.overflow = 'hidden';
    }

    function close() {
        nav.classList.remove('open');
        backdrop.classList.remove('open');
        toggle.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
        document.body.style.overflow = '';
    }

    toggle.addEventListener('click', function() {
        nav.classList.contains('open') ? close() : open();
    });

    backdrop.addEventListener('click', close);

    nav.querySelectorAll('a').forEach(function(link) {
        link.addEventListener('click', close);
    });

    window.addEventListener('resize', function() {
        if (window.innerWidth > 768 && nav.classList.contains('open')) close();
    });
})();
</script>
{{- end}}
