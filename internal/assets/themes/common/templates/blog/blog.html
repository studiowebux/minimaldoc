<!DOCTYPE html>
<html lang="en" data-theme="light" data-base-path="{{.BasePath}}">
<head>
{{template "landing-head" .}}
<title>Blog | {{.Site.Config.Title}}</title>
<meta name="description" content="Latest news and updates">
<link rel="stylesheet" href="{{.BasePath}}/css/base.css?v={{.Version}}">
<link rel="stylesheet" href="{{.BasePath}}/css/main.css?v={{.Version}}">
<link rel="stylesheet" href="{{.BasePath}}/css/landing.css?v={{.Version}}">
{{if hasCustomTheme .Site.Config.ThemeConfig}}<link rel="stylesheet" href="{{.BasePath}}/css/custom-theme.css?v={{.Version}}">{{end}}
<style>
.blog-hero {
    padding: 4rem 2rem 3rem;
    text-align: center;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-primary);
}
.blog-hero-content {
    max-width: 800px;
    margin: 0 auto;
}
.blog-hero h1 {
    font-size: 2.5rem;
    font-weight: 700;
    margin: 0 0 1rem;
    color: var(--text-primary);
}
.blog-hero-description {
    font-size: 1.25rem;
    color: var(--text-secondary);
    margin: 0 0 2rem;
}
.blog-search-container {
    position: relative;
    max-width: 500px;
    margin: 0 auto;
}
.blog-search-input {
    width: 100%;
    padding: 1rem 1rem 1rem 3rem;
    font-size: 1rem;
    border: 2px solid var(--border-primary);
    border-radius: 8px;
    background: var(--bg-primary);
    color: var(--text-primary);
    transition: border-color 0.2s, box-shadow 0.2s;
}
.blog-search-input:focus {
    outline: none;
    border-color: var(--link-color);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}
.blog-search-input::placeholder {
    color: var(--text-muted);
}
.blog-search-icon {
    position: absolute;
    left: 1rem;
    top: 50%;
    transform: translateY(-50%);
    width: 1.25rem;
    height: 1.25rem;
    color: var(--text-muted);
    pointer-events: none;
}
.blog-content {
    padding: 3rem 2rem;
    max-width: 1200px;
    margin: 0 auto;
}
.blog-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 2rem;
}
.blog-card {
    background: var(--bg-primary);
    border: 1px solid var(--border-primary);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
}
.blog-card:hover {
    border-color: var(--link-color);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    transform: translateY(-4px);
}
.blog-card-image {
    width: 100%;
    height: 200px;
    object-fit: cover;
}
.blog-card-body {
    padding: 1.5rem;
}
.blog-card-category {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--link-color);
    margin-bottom: 0.75rem;
}
.blog-card-title {
    font-size: 1.25rem;
    font-weight: 700;
    margin: 0 0 0.75rem;
    line-height: 1.3;
}
.blog-card-title a {
    color: var(--text-primary);
    text-decoration: none;
    transition: color 0.2s;
}
.blog-card-title a:hover {
    color: var(--link-color);
}
.blog-card-excerpt {
    font-size: 0.9375rem;
    color: var(--text-secondary);
    line-height: 1.6;
    margin: 0 0 1rem;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.blog-card-meta {
    display: flex;
    align-items: center;
    gap: 1rem;
    font-size: 0.875rem;
    color: var(--text-muted);
}
.blog-card-date {
    display: flex;
    align-items: center;
    gap: 0.375rem;
}
.blog-card-reading {
    display: flex;
    align-items: center;
    gap: 0.375rem;
}
.blog-empty {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text-muted);
}
.blog-empty-icon {
    font-size: 3rem;
    margin-bottom: 1rem;
    opacity: 0.5;
}
.blog-loading {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text-muted);
}
@media (max-width: 768px) {
    .blog-hero {
        padding: 3rem 1rem 2rem;
    }
    .blog-hero h1 {
        font-size: 2rem;
    }
    .blog-content {
        padding: 2rem 1rem;
    }
    .blog-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
<body>
<a href="#main" class="skip-link">Skip to main content</a>
<div class="landing-page">
{{template "landing-header" .}}

<main id="main" class="landing-main" style="max-width: none; padding: 0;">
<section class="blog-hero">
<div class="blog-hero-content">
<h1>Blog</h1>
<p class="blog-hero-description">Latest news and updates</p>
<div class="blog-search-container">
<input type="text" id="blog-search-input" class="blog-search-input" placeholder="Search posts..." autocomplete="off">
<svg class="blog-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<circle cx="11" cy="11" r="8"/>
<path d="m21 21-4.35-4.35"/>
</svg>
</div>
</div>
</section>

<section class="blog-content">
<div class="blog-grid" id="blog-posts" data-minimaldoc-blog="list" data-limit="12">
<div class="blog-loading">Loading posts...</div>
</div>
</section>
</main>

{{template "landing-footer" .}}
</div>
{{template "landing-scripts" .}}
<script>
(function() {
    var searchInput = document.getElementById('blog-search-input');
    if (searchInput) {
        var timeout;
        searchInput.addEventListener('input', function() {
            clearTimeout(timeout);
            timeout = setTimeout(function() {
                if (window.MinimalDoc && window.MinimalDoc.blog) {
                    var container = document.getElementById('blog-posts');
                    var query = searchInput.value.trim();
                    container.innerHTML = '<div class="blog-loading">Searching...</div>';
                    window.MinimalDoc.blog.list({ limit: 12, search: query }).then(function(response) {
                        window.renderBlogCards(container, response.posts || []);
                    }).catch(function() {
                        container.innerHTML = '<div class="blog-empty"><div class="blog-empty-icon">:(</div>Failed to search posts</div>';
                    });
                }
            }, 300);
        });
    }

    function renderPosts(container, posts) {
        if (!posts.length) {
            container.innerHTML = '<div class="blog-empty"><div class="blog-empty-icon">:(</div>No posts found</div>';
            return;
        }
        var html = '';
        posts.forEach(function(post) {
            html += '<article class="blog-card">';
            if (post.featured_image) {
                html += '<img src="' + escapeHtml(post.featured_image) + '" alt="" class="blog-card-image" loading="lazy">';
            }
            html += '<div class="blog-card-body">';
            if (post.category) {
                html += '<span class="blog-card-category">' + escapeHtml(post.category) + '</span>';
            }
            html += '<h2 class="blog-card-title"><a href="/blog/' + escapeHtml(post.slug) + '">' + escapeHtml(post.title) + '</a></h2>';
            if (post.description) {
                html += '<p class="blog-card-excerpt">' + escapeHtml(post.description) + '</p>';
            }
            html += '<div class="blog-card-meta">';
            if (post.published_at) {
                html += '<span class="blog-card-date">' + formatDate(post.published_at) + '</span>';
            }
            if (post.reading_time) {
                html += '<span class="blog-card-reading">' + post.reading_time + ' min read</span>';
            }
            html += '</div></div></article>';
        });
        container.innerHTML = html;
    }

    function escapeHtml(text) {
        if (!text) return '';
        var div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function formatDate(dateStr) {
        var date = new Date(dateStr);
        return date.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }

    window.renderBlogCards = renderPosts;
})();
</script>
</body>
</html>
