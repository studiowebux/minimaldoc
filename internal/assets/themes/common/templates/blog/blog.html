<!DOCTYPE html>
<html lang="en" data-theme="light" data-base-path="{{.BasePath}}">
<head>
{{template "landing-head" .}}
<title>Blog | {{.Site.Config.Title}}</title>
<meta name="description" content="Latest news and updates">
<link rel="stylesheet" href="{{.BasePath}}/css/tokens.css?v={{.Version}}">
<link rel="stylesheet" href="{{.BasePath}}/css/base.css?v={{.Version}}">
<link rel="stylesheet" href="{{.BasePath}}/css/main.css?v={{.Version}}">
<link rel="stylesheet" href="{{.BasePath}}/css/landing.css?v={{.Version}}">
{{if hasCustomTheme .Site.Config.ThemeConfig}}<link rel="stylesheet" href="{{.BasePath}}/css/custom-theme.css?v={{.Version}}">{{end}}
<link rel="stylesheet" href="{{.BasePath}}/css/blog.css?v={{.Version}}">
</head>
<body>
<a href="#main" class="skip-link">Skip to main content</a>
<div class="landing-page">
{{template "landing-header" .}}

<main id="main" class="landing-main" style="max-width: none; padding: 0;">
<section class="blog-hero">
<div class="blog-hero-content">
<h1>Blog</h1>
<p class="blog-hero-description">Latest news and updates</p>
<div class="blog-search-container">
<input type="text"
       id="blog-search-input"
       class="blog-search-input"
       name="q"
       placeholder="Search posts..."
       autocomplete="off"
       hx-get="{{.APIEndpoint}}/api/blog/fragments/search"
       hx-trigger="input changed delay:300ms, search"
       hx-target="#blog-search-dropdown">
<svg class="blog-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<circle cx="11" cy="11" r="8"/>
<path d="m21 21-4.35-4.35"/>
</svg>
<div id="blog-search-dropdown" class="blog-search-dropdown"></div>
</div>
</div>
</section>

<section class="blog-content">
<div class="blog-grid"
     id="blog-posts"
     hx-get="{{.APIEndpoint}}/api/blog/fragments/posts"
     hx-trigger="load"
     hx-indicator=".blog-loading">
<div class="blog-loading htmx-indicator">Loading posts...</div>
</div>
</section>
</main>

{{template "landing-footer" .}}
</div>
{{template "landing-scripts" .}}
<script>
// Handle search filtering of main grid when user presses Enter
document.getElementById('blog-search-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        e.preventDefault();
        var query = this.value.trim();
        var grid = document.getElementById('blog-posts');
        var url = '{{.APIEndpoint}}/api/blog/fragments/posts';
        if (query) {
            url += '?q=' + encodeURIComponent(query);
        }
        htmx.ajax('GET', url, {target: grid, swap: 'innerHTML'});
        document.getElementById('blog-search-dropdown').innerHTML = '';
    }
});
// Hide dropdown when clicking outside
document.addEventListener('click', function(e) {
    var container = document.querySelector('.blog-search-container');
    var dropdown = document.getElementById('blog-search-dropdown');
    if (!container.contains(e.target)) {
        dropdown.innerHTML = '';
    }
});
</script>
</body>
</html>
