<!DOCTYPE html>
<html lang="en" data-theme="light" data-base-path="{{.BasePath}}">
<head>
{{template "landing-head" .}}
<title>Blog | {{.Site.Config.Title}}</title>
<meta name="description" content="Blog article">
<link rel="stylesheet" href="{{.BasePath}}/css/tokens.css?v={{.Version}}">
<link rel="stylesheet" href="{{.BasePath}}/css/base.css?v={{.Version}}">
<link rel="stylesheet" href="{{.BasePath}}/css/main.css?v={{.Version}}">
<link rel="stylesheet" href="{{.BasePath}}/css/landing.css?v={{.Version}}">
{{if hasCustomTheme .Site.Config.ThemeConfig}}<link rel="stylesheet" href="{{.BasePath}}/css/custom-theme.css?v={{.Version}}">{{end}}
<link rel="stylesheet" href="{{.BasePath}}/css/blog.css?v={{.Version}}">
</head>
<body>
<a href="#main" class="skip-link">Skip to main content</a>
<div class="landing-page">
{{template "landing-header" .}}

<main id="main" class="landing-main" style="max-width: none; padding: 0;">
<article class="blog-article" id="blog-article">
    <div class="blog-article-loading">Loading article...</div>
</article>
</main>

{{template "landing-footer" .}}
</div>
{{template "landing-scripts" .}}
<script>
(function() {
    var apiEndpoint = '{{.APIEndpoint}}';
    var slug = window.location.pathname.replace(/^\/blog\//, '').replace(/\/$/, '');
    var container = document.getElementById('blog-article');

    if (!slug) {
        container.innerHTML = '<div class="blog-article-error">Article not found</div>';
        return;
    }

    // Load article content via HTMX
    htmx.ajax('GET', apiEndpoint + '/api/blog/fragments/posts/' + encodeURIComponent(slug), {
        target: container,
        swap: 'innerHTML'
    }).then(function() {
        // After article loads, load related posts
        var relatedContainer = document.createElement('div');
        relatedContainer.id = 'blog-related';
        container.appendChild(relatedContainer);
        htmx.ajax('GET', apiEndpoint + '/api/blog/fragments/posts/' + encodeURIComponent(slug) + '/related', {
            target: relatedContainer,
            swap: 'innerHTML'
        });

        // Load comments section
        var commentsContainer = document.createElement('div');
        commentsContainer.id = 'blog-comments-section';
        container.appendChild(commentsContainer);
        htmx.ajax('GET', apiEndpoint + '/api/blog/fragments/posts/' + encodeURIComponent(slug) + '/comments', {
            target: commentsContainer,
            swap: 'innerHTML'
        });
    });
})();
</script>
</body>
</html>
