<!DOCTYPE html>
<html lang="en" data-theme="light" data-base-path="{{.BasePath}}">
<head>
{{template "landing-head" .}}
<title>Blog | {{.Site.Config.Title}}</title>
<meta name="description" content="Blog article">
<link rel="stylesheet" href="{{.BasePath}}/css/base.css?v={{.Version}}">
<link rel="stylesheet" href="{{.BasePath}}/css/main.css?v={{.Version}}">
<link rel="stylesheet" href="{{.BasePath}}/css/landing.css?v={{.Version}}">
{{if hasCustomTheme .Site.Config.ThemeConfig}}<link rel="stylesheet" href="{{.BasePath}}/css/custom-theme.css?v={{.Version}}">{{end}}
<style>
.blog-article {
    max-width: 800px;
    margin: 0 auto;
    padding: 3rem 2rem;
}
.blog-article-header {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 1rem;
    margin-bottom: 2rem;
    padding-bottom: 2rem;
    border-bottom: 1px solid var(--border-primary);
}
.blog-article-back {
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 0.9375rem;
    border: none;
}
.blog-article-back:hover {
    color: var(--link-color);
}
.blog-article-category {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--link-color);
    background: rgba(37, 99, 235, 0.1);
    padding: 0.375rem 0.75rem;
    border-radius: 4px;
}
.blog-article-title {
    font-size: 2.5rem;
    font-weight: 700;
    line-height: 1.2;
    margin: 0;
    color: var(--text-primary);
}
.blog-article-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    font-size: 0.9375rem;
    color: var(--text-secondary);
}
.blog-article-featured {
    width: 100%;
    max-height: 400px;
    object-fit: cover;
    border-radius: 12px;
    margin-bottom: 2rem;
}
.blog-article-content {
    font-size: 1.125rem;
    line-height: 1.8;
    color: var(--text-primary);
}
.blog-article-content h2 {
    font-size: 1.75rem;
    margin: 2rem 0 1rem;
}
.blog-article-content h3 {
    font-size: 1.5rem;
    margin: 1.75rem 0 0.75rem;
}
.blog-article-content p {
    margin: 0 0 1.25rem;
}
.blog-article-content pre {
    background: var(--bg-code);
    color: #e9ecef;
    padding: 1rem;
    border-radius: 8px;
    overflow-x: auto;
    margin: 1.5rem 0;
}
.blog-article-content code {
    font-family: 'Monaco', 'Consolas', monospace;
    font-size: 0.9em;
}
.blog-article-content img {
    max-width: 100%;
    border-radius: 8px;
    margin: 1.5rem 0;
}
.blog-article-content a {
    color: var(--link-color);
}
.blog-article-content blockquote {
    border-left: 4px solid var(--link-color);
    margin: 1.5rem 0;
    padding: 0.5rem 0 0.5rem 1.5rem;
    color: var(--text-secondary);
    font-style: italic;
}
.blog-article-loading,
.blog-article-error {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text-muted);
}
.blog-article-error {
    color: var(--text-secondary);
}
.blog-related {
    margin-top: 3rem;
    padding-top: 2rem;
    border-top: 1px solid var(--border-primary);
}
.blog-related h3 {
    font-size: 1.25rem;
    font-weight: 600;
    margin: 0 0 1.5rem;
    color: var(--text-primary);
}
.blog-related-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 1.5rem;
}
.blog-related-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border-primary);
    border-radius: 8px;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.2s;
}
.blog-related-card:hover {
    border-color: var(--link-color);
    transform: translateY(-2px);
}
.blog-related-image {
    width: 100%;
    height: 120px;
    object-fit: cover;
}
.blog-related-card h4 {
    padding: 1rem;
    margin: 0;
    font-size: 0.9375rem;
    font-weight: 600;
}
.blog-related-card h4 a {
    color: var(--text-primary);
    text-decoration: none;
}
.blog-related-card h4 a:hover {
    color: var(--link-color);
}
.blog-comments {
    margin-top: 3rem;
    padding-top: 2rem;
    border-top: 1px solid var(--border-primary);
}
.blog-comments h3 {
    font-size: 1.25rem;
    font-weight: 600;
    margin: 0 0 1.5rem;
    color: var(--text-primary);
}
.blog-comments-empty {
    color: var(--text-muted);
    text-align: center;
    padding: 2rem 0;
}
.blog-comment {
    display: flex;
    gap: 1rem;
    padding: 1.25rem 0;
    border-bottom: 1px solid var(--border-primary);
}
.blog-comment:last-of-type {
    border-bottom: none;
}
.blog-comment-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--bg-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--text-secondary);
    flex-shrink: 0;
}
.blog-comment-body {
    flex: 1;
    min-width: 0;
}
.blog-comment-header {
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
    margin-bottom: 0.5rem;
}
.blog-comment-author {
    font-weight: 600;
    color: var(--text-primary);
}
.blog-comment-date {
    font-size: 0.8125rem;
    color: var(--text-muted);
}
.blog-comment-content {
    font-size: 0.9375rem;
    line-height: 1.6;
    color: var(--text-primary);
}
.blog-comment-form {
    margin-top: 2rem;
    padding: 1.5rem;
    background: var(--bg-secondary);
    border-radius: 12px;
}
.blog-comment-form h4 {
    font-size: 1rem;
    font-weight: 600;
    margin: 0 0 1rem;
    color: var(--text-primary);
}
.blog-comment-form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 1rem;
}
.blog-comment-form input,
.blog-comment-form textarea {
    width: 100%;
    padding: 0.75rem 1rem;
    font-size: 1rem;
    font-family: inherit;
    border: 2px solid var(--border-primary);
    border-radius: 8px;
    background: var(--bg-primary);
    color: var(--text-primary);
}
.blog-comment-form input:focus,
.blog-comment-form textarea:focus {
    outline: none;
    border-color: var(--link-color);
}
.blog-comment-form textarea {
    min-height: 120px;
    resize: vertical;
    margin-bottom: 1rem;
}
.blog-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.75rem 1.5rem;
    font-size: 0.9375rem;
    font-weight: 500;
    border-radius: 8px;
    cursor: pointer;
    border: none;
}
.blog-btn-primary {
    background: var(--link-color);
    color: white;
}
.blog-btn-primary:hover {
    filter: brightness(1.1);
}
.blog-comment-notice {
    margin-top: 0.75rem;
    font-size: 0.8125rem;
    color: var(--text-muted);
}
@media (max-width: 768px) {
    .blog-article {
        padding: 2rem 1rem;
    }
    .blog-article-title {
        font-size: 1.75rem;
    }
    .blog-article-content {
        font-size: 1rem;
    }
    .blog-comment-form-row {
        grid-template-columns: 1fr;
    }
    .blog-related-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
<body>
<a href="#main" class="skip-link">Skip to main content</a>
<div class="landing-page">
{{template "landing-header" .}}

<main id="main" class="landing-main" style="max-width: none; padding: 0;">
<article class="blog-article" id="blog-article">
    <div class="blog-article-loading">Loading article...</div>
</article>
</main>

{{template "landing-footer" .}}
</div>
{{template "landing-scripts" .}}
<script>
(function() {
    var apiEndpoint = '{{.APIEndpoint}}';
    var slug = window.location.pathname.replace(/^\/blog\//, '').replace(/\/$/, '');
    var container = document.getElementById('blog-article');

    if (!slug) {
        container.innerHTML = '<div class="blog-article-error">Article not found</div>';
        return;
    }

    // Load article content via HTMX
    htmx.ajax('GET', apiEndpoint + '/api/blog/fragments/posts/' + encodeURIComponent(slug), {
        target: container,
        swap: 'innerHTML'
    }).then(function() {
        // After article loads, load related posts
        var relatedContainer = document.createElement('div');
        relatedContainer.id = 'blog-related';
        container.appendChild(relatedContainer);
        htmx.ajax('GET', apiEndpoint + '/api/blog/fragments/posts/' + encodeURIComponent(slug) + '/related', {
            target: relatedContainer,
            swap: 'innerHTML'
        });

        // Load comments section
        var commentsContainer = document.createElement('div');
        commentsContainer.id = 'blog-comments-section';
        container.appendChild(commentsContainer);
        htmx.ajax('GET', apiEndpoint + '/api/blog/fragments/posts/' + encodeURIComponent(slug) + '/comments', {
            target: commentsContainer,
            swap: 'innerHTML'
        });
    });
})();
</script>
</body>
</html>
