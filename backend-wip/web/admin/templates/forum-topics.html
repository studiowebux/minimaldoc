{{define "forum-topics.html"}}
<!DOCTYPE html>
<html lang="en">
{{template "head" .}}
<body>
    <div class="admin-layout">
        {{template "sidebar" .}}
        <main class="main-content">
            {{template "content-header" .}}
            <div class="content-body">
                <div class="forum-topics-page">
                    <div class="card">
                        <div class="card-header">
                            <h3>Forum Topics</h3>
                            <div class="card-actions">
                                <select id="status-filter" onchange="loadTopics()">
                                    <option value="">All Status</option>
                                    <option value="open">Open</option>
                                    <option value="closed">Closed</option>
                                    <option value="locked">Locked</option>
                                </select>
                                <input type="text" id="search-input" placeholder="Search topics..." onkeyup="debounceSearch()">
                            </div>
                        </div>
                        <div class="card-body" id="topic-list">
                            <p class="loading">Loading...</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script nonce="{{.Nonce}}">
        let searchTimeout;

        function debounceSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(loadTopics, 300);
        }

        async function loadTopics() {
            const status = document.getElementById('status-filter').value;
            const search = document.getElementById('search-input').value;
            let url = '/api/forum/topics?limit=50';
            if (status) url += '&status=' + status;
            if (search) url += '&q=' + encodeURIComponent(search);

            try {
                const res = await fetch(url);
                const data = await res.json();
                renderTopics(data.topics || []);
            } catch (e) {
                document.getElementById('topic-list').innerHTML = '<p class="error">Failed to load topics</p>';
            }
        }

        function renderTopics(topics) {
            if (!topics.length) {
                document.getElementById('topic-list').innerHTML = '<p>No topics found.</p>';
                return;
            }
            let html = '<table class="data-table"><thead><tr><th>Title</th><th>Author</th><th>Status</th><th>Posts</th><th>Views</th><th>Created</th><th>Actions</th></tr></thead><tbody>';
            for (const topic of topics) {
                const badges = [];
                if (topic.is_pinned) badges.push('<span class="badge badge-info">Pinned</span>');
                if (topic.is_solved) badges.push('<span class="badge badge-success">Solved</span>');

                html += `<tr>
                    <td>
                        ${escapeHtml(topic.title)}
                        ${badges.join(' ')}
                    </td>
                    <td>${escapeHtml(topic.author_name || 'Unknown')}</td>
                    <td><span class="badge badge-${getStatusClass(topic.status)}">${topic.status}</span></td>
                    <td>${topic.post_count}</td>
                    <td>${topic.view_count}</td>
                    <td>${formatDate(topic.created_at)}</td>
                    <td>
                        <button class="btn btn-sm btn-secondary" data-action="toggle-pin" data-id="${escapeHtml(topic.id)}">${topic.is_pinned ? 'Unpin' : 'Pin'}</button>
                        <button class="btn btn-sm btn-secondary" data-action="toggle-status" data-id="${escapeHtml(topic.id)}" data-status="${escapeHtml(topic.status)}">${topic.status === 'open' ? 'Close' : 'Open'}</button>
                        <button class="btn btn-sm btn-danger" data-action="delete-topic" data-id="${escapeHtml(topic.id)}">Delete</button>
                    </td>
                </tr>`;
            }
            html += '</tbody></table>';
            document.getElementById('topic-list').innerHTML = html;
        }

        function getStatusClass(status) {
            switch (status) {
                case 'open': return 'success';
                case 'closed': return 'secondary';
                case 'locked': return 'warning';
                default: return 'secondary';
            }
        }

        async function togglePin(id) {
            try {
                const res = await fetch('/api/forum/topics/' + id + '/pin', {method: 'POST'});
                if (!res.ok) throw new Error('Failed');
                loadTopics();
            } catch (e) {
                alert('Failed to toggle pin');
            }
        }

        async function toggleStatus(id, currentStatus) {
            try {
                const endpoint = currentStatus === 'open' ? 'close' : 'open';
                const res = await fetch('/api/forum/topics/' + id + '/' + endpoint, {method: 'POST'});
                if (!res.ok) throw new Error('Failed');
                loadTopics();
            } catch (e) {
                alert('Failed to update status');
            }
        }

        async function deleteTopic(id) {
            if (!confirm('Delete this topic and all its posts?')) return;
            try {
                const res = await fetch('/api/forum/topics/' + id, {method: 'DELETE'});
                if (!res.ok) throw new Error('Failed');
                loadTopics();
            } catch (e) {
                alert('Failed to delete topic');
            }
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'N/A';
            return new Date(dateStr).toLocaleDateString();
        }

        document.addEventListener('click', function(e) {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;
            const action = btn.getAttribute('data-action');
            const id = btn.getAttribute('data-id');
            if (action === 'toggle-pin') togglePin(id);
            else if (action === 'toggle-status') toggleStatus(id, btn.getAttribute('data-status'));
            else if (action === 'delete-topic') deleteTopic(id);
        });

        loadTopics();
    </script>
</body>
</html>
{{end}}
