{{define "forum-topic.html"}}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topic | {{.site_name}}</title>
    <link rel="stylesheet" href="/theme/css/tokens.css">
    <link rel="stylesheet" href="/static/css/public.css">
    <script src="/static/js/htmx.min.js"></script>
</head>
<body>
    {{template "header" .}}

    <section class="forum-content">
        <div class="forum-topic-container">
            <div class="forum-breadcrumb">
                <a href="/forum/">Forum</a> &raquo; <span id="topic-title">Loading...</span>
            </div>

            <div id="forum-topic-detail"
                 hx-get="/api/forum/fragments/topics/{{.slug}}/detail"
                 hx-trigger="load"
                 hx-swap="innerHTML">
                <div class="forum-loading">Loading topic...</div>
            </div>

            <div id="forum-posts"
                 hx-get="/api/forum/fragments/topics/{{.slug}}/posts"
                 hx-trigger="load"
                 hx-swap="innerHTML">
                <div class="forum-loading">Loading posts...</div>
            </div>

            {{if .authenticated}}
            <div id="reply-form-container"
                 hx-get="/api/forum/fragments/topics/{{.slug}}/reply-form"
                 hx-trigger="load"
                 hx-swap="innerHTML">
            </div>
            {{else}}
            <div class="forum-login-prompt">
                <p><a href="/login?site_id={{.site_id}}">Log in</a> to reply to this topic.</p>
            </div>
            {{end}}
        </div>
    </section>

    {{template "footer"}}

    <script src="/static/js/htmx-json-enc.js"></script>
    <script nonce="{{.Nonce}}">
    document.body.addEventListener('htmx:afterSwap', function(event) {
        if (event.detail.target.id === 'forum-topic-detail') {
            var titleEl = event.detail.target.querySelector('.forum-topic-title, h1');
            if (titleEl) {
                document.getElementById('topic-title').textContent = titleEl.textContent;
                document.title = titleEl.textContent + ' | Forum';
            }
        }
    });
    </script>
</body>
</html>
{{end}}
