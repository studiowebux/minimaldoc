# MinimalDoc - Hybrid Configuration (Static + Optional Backend)
#
# Architecture:
# - Static site served by nginx (/, /docs, /changelog, /kb, /faq, etc.)
# - Backend routes proxied to Go server:
#   - /blog/* -> Public backend (port 8080)
#   - /forum/* -> Public backend (port 8080)
#   - /api/* -> Public backend (port 8080)
#   - /login, /register, /logout -> Public backend (port 8080)
#   - /admin/* -> Admin portal (port 8090, IP restricted)
#
# This config supports the hybrid model where the static site generator
# is the core, with an optional backend for blog, forum, and analytics.

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=1r/s;

upstream minimaldoc_public {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream minimaldoc_admin {
    server 127.0.0.1:8090;
    keepalive 16;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    # TLS
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Logging
    access_log /var/log/nginx/minimaldoc_access.log;
    error_log /var/log/nginx/minimaldoc_error.log;

    client_max_body_size 10M;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Root for static site (generated by minimaldoc)
    root /var/www/minimaldoc/public;

    # ============================================
    # BACKEND ROUTES (proxied to Go server)
    # ============================================

    # Blog pages (backend)
    location /blog {
        proxy_pass http://minimaldoc_public;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Forum pages (backend)
    location /forum {
        proxy_pass http://minimaldoc_public;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Auth pages (backend)
    location /login {
        proxy_pass http://minimaldoc_public;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /register {
        proxy_pass http://minimaldoc_public;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /logout {
        proxy_pass http://minimaldoc_public;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Public API
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://minimaldoc_public;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Health check
    location = /health {
        proxy_pass http://minimaldoc_public;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Client JS/CSS (for embedding in static sites)
    location ~ ^/(minimaldoc\.js|minimaldoc\.css)$ {
        proxy_pass http://minimaldoc_public;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=3600";
    }

    # Static files for backend pages (CSS, JS, htmx)
    location /static/ {
        proxy_pass http://minimaldoc_public;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=3600";
    }

    # Admin portal - IP restricted
    location /admin {
        # Restrict to specific IPs
        allow 127.0.0.1;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        # allow YOUR_IP_HERE;
        deny all;

        # Rate limit login
        location = /admin/login {
            limit_req zone=login_limit burst=5 nodelay;

            proxy_pass http://minimaldoc_admin;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        proxy_pass http://minimaldoc_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Uploads (images, files)
    location /uploads/ {
        proxy_pass http://minimaldoc_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=86400";
    }

    # ============================================
    # STATIC SITE (served by nginx)
    # ============================================

    # All other paths -> static files
    location / {
        try_files $uri $uri/ $uri.html =404;

        # Cache static assets
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1d;
            add_header Cache-Control "public, immutable";
        }
    }
}
