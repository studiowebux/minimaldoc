  copyright: "2026 Studio Webux. GPL-3.0 License."
  links:
    - title: "Documentation"
      items:
        - text: "Getting Started"
          url: "/getting-started/quick-start.html"
        - text: "Configuration"
          url: "/getting-started/configuration.html"
        - text: "Project Structure"
          url: "/core-concepts/project-structure.html"
    - title: "Features"
      items:
        - text: "Overview"
          url: "/features/overview.html"
        - text: "Search"
          url: "/features/search.html"
        - text: "Code Highlighting"
          url: "/features/code-highlighting.html"
        - text: "Admonitions"
          url: "/features/admonitions.html"
    - title: "API & Guides"
      items:
        - text: "OpenAPI"
          url: "/openapi/overview.html"
        - text: "CLI Reference"
          url: "/api-reference/cli.html"
        - text: "Config Schema"
          url: "/api-reference/config-schema.html"
