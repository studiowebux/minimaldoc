title: MinimalDoc
description: A minimal static site generator for documentation. Fast, clean, and easy to use.
base_url: https://minimaldoc.com
author: Studio Webux
theme: default
dark_mode: false
enable_llms: true
enable_search: true
clean_urls: false

openapi:
  enabled: true
  spec_files:
    - petstore.yaml

status:
  enabled: true
  title: "MinimalDoc Status"
  description: "Example status page with demo data"
  path: "status"
  show_history: true
  rss_enabled: true

changelog:
  enabled: true
  title: "Changelog"
  path: "changelog"
  rss_enabled: true
  repository: "https://github.com/studiowebux/minimaldoc"

stale_warning:
  enabled: true
  threshold_days: 365
  show_update_date: true

landing:
  enabled: true
  nav:
    - text: "Docs"
      url: "/getting-started/installation.html"
    - text: "Features"
      url: "/features/overview.html"
    - text: "Status"
      url: "/status/"
  hero:
    title: "Documentation Made Simple"
    subtitle: "A minimal static site generator for documentation. Fast, clean, and easy to use."
    buttons:
      - text: "Download Binary"
        url: "https://github.com/studiowebux/minimaldoc/releases"
        primary: true
      - text: "View on GitHub"
        url: "https://github.com/studiowebux/minimaldoc"
        primary: false

  features:
    title: "Features"
    items:
      - emoji: "~"
        title: "Markdown-based"
        description: "Write documentation in plain Markdown with YAML frontmatter. No complex configuration required."
      - emoji: "@"
        title: "Lightning Fast"
        description: "Generate complete documentation sites in milliseconds. Built with Go for maximum performance."
      - emoji: "#"
        title: "Dark Mode"
        description: "Automatic light and dark themes with localStorage persistence. Easy on the eyes, day or night."
      - emoji: "$"
        title: "Search"
        description: "Client-side full-text search with keyboard shortcuts. Find what you need instantly."
      - emoji: "%"
        title: "OpenAPI Support"
        description: "Interactive API documentation with endpoint testing, code samples, and schema visualization."
      - emoji: "&"
        title: "Status Pages"
        description: "Track service health with incidents, maintenance windows, uptime metrics, and RSS feeds."
      - emoji: "+"
        title: "Changelog"
        description: "Version history with RSS feed. Automatically generated from markdown release notes."
      - emoji: "*"
        title: "Landing Pages"
        description: "Marketing-style homepages with hero sections, feature grids, and call-to-action blocks."
      - emoji: "^"
        title: "Portfolio"
        description: "Showcase projects with filterable tags, images, and individual project pages."
      - emoji: "="
        title: "SEO Ready"
        description: "Sitemap.xml, meta tags, llms.txt for AI assistants, and clean URL support."
      - emoji: "!"
        title: "Syntax Highlighting"
        description: "Code blocks with support for 100+ languages via Chroma. Copy button included."
      - emoji: ">"
        title: "GFM Support"
        description: "Full GitHub Flavored Markdown including tables, task lists, and admonitions."

  steps:
    title: "Quick Start"
    items:
      - title: "Install"
        description: "Download the binary for your OS/architecture"
        code: |
          curl -sSL \
           https://github.com/studiowebux/minimaldoc/releases/latest/download/minimaldoc-$(uname -s)-$(uname -m) \
           -o minimaldoc
          chmod +x minimaldoc
      - title: "Initialize"
        description: "Create your docs folder with example content"
        code: "minimaldoc init my-docs"
      - title: "Build"
        description: "Generate your static site"
        code: "minimaldoc build"
      - title: "Deploy"
        description: "Upload the public directory to any static host"
        code: "# Any static web hosting"

  links:
    title: "Resources"
    items:
      - icon: "github"
        title: "GitHub"
        description: "Source code and issues"
        url: "https://github.com/studiowebux/minimaldoc"
      - icon: "discord"
        title: "Community"
        description: "Join the discussion"
        url: "https://discord.gg/bBt2mYNwnd"

  opensource:
    title: "Open Source"
    description: "GPL-3.0 Licensed. Self-host your documentation with full control. Built by Studio Webux."
    links:
      - text: "GitHub Repository"
        url: "https://github.com/studiowebux/minimaldoc"
      - text: "Releases"
        url: "https://github.com/studiowebux/minimaldoc/releases"

portfolio:
  enabled: true
  title: "Projects"
  description: "Sites built with MinimalDoc"
  path: "projects"

contact:
  enabled: true
  title: "Contact"
  description: "Get in touch with Studio Webux"
  path: "contact"
  email: "hello@studiowebux.com"
  info:
    - icon: "mail"
      text: "hello@studiowebux.com"
    - icon: "location"
      text: "Canada"

faq:
  enabled: true
  title: "FAQ"
  description: "Frequently asked questions about MinimalDoc"
  path: "faq"
  categories:
    - name: "General"
      items:
        - question: "What is MinimalDoc?"
          answer: "MinimalDoc is a minimal static site generator for documentation. It converts Markdown files to a fast, clean HTML site."
        - question: "Is MinimalDoc free?"
          answer: "Yes, MinimalDoc is open source and released under the GPL-3.0 license."
    - name: "Technical"
      items:
        - question: "What languages are supported for syntax highlighting?"
          answer: "MinimalDoc supports 100+ programming languages via Chroma, including Go, JavaScript, Python, Rust, and many more."
        - question: "Can I customize the theme?"
          answer: "Yes, you can create custom CSS themes or modify the existing templates. See the custom themes documentation for details."

legal:
  enabled: true
  path: "legal"
  footer_group: "Legal"

knowledgebase:
  enabled: true
  title: "Knowledge Base"
  description: "Find answers, guides, and solutions"
  path: "kb"
  search:
    enabled: true
    placeholder: "Search articles..."
  categories:
    getting-started:
      name: "Getting Started"
      description: "Installation, setup, and first steps"
      icon: "rocket"
      order: 1
    features:
      name: "Features"
      description: "Search, themes, code blocks, and more"
      icon: "code"
      order: 2
    troubleshooting:
      name: "Troubleshooting"
      description: "Common issues and solutions"
      icon: "wrench"
      order: 3

roadmap:
  enabled: true
  title: "Roadmap"
  description: "What we're building and where we're headed."
  layout: "board"
  show_versions: true
  path: "roadmap"
  columns:
    - id: planned
      label: "Planned"
    - id: in_progress
      label: "In Progress"
    - id: shipped
      label: "Shipped"
  items:
    - title: "Dark mode"
      description: "System-aware theme switching with manual override and localStorage persistence."
      status: shipped
      version: "v1.0"
      tags: ["ui", "theme"]
      shipped_date: "2025-01-15"
      changelog_url: "/changelog/#v1.0"
    - title: "OpenAPI documentation"
      description: "Interactive API docs with endpoint testing, code samples, and schema visualization."
      status: shipped
      version: "v1.0"
      tags: ["api", "docs"]
      shipped_date: "2025-01-15"
      changelog_url: "/changelog/#v1.0"
    - title: "Status pages"
      description: "Track service health with incidents, maintenance windows, uptime metrics, and RSS feeds."
      status: shipped
      version: "v1.1"
      tags: ["monitoring"]
      shipped_date: "2025-02-01"
      changelog_url: "/changelog/#v1.1"
    - title: "Versioned documentation"
      description: "Multi-version docs with version selector and EOL warnings."
      status: shipped
      version: "v1.2"
      tags: ["docs"]
      shipped_date: "2025-03-01"
      changelog_url: "/changelog/#v1.2"
    - title: "Blog and forum"
      description: "Community blog CMS and discussion forum with categories, reputation, and moderation."
      status: shipped
      version: "v1.3"
      tags: ["community", "cms"]
      shipped_date: "2025-06-01"
    - title: "Knowledge base"
      description: "Categorized articles with search, icons, and structured navigation."
      status: shipped
      version: "v1.4"
      tags: ["docs", "search"]
      shipped_date: "2025-09-01"
    - title: "Roadmap page"
      description: "Visual roadmap with board and timeline layouts, tag filtering."
      status: in_progress
      version: "v1.4"
      tags: ["ui", "docs"]
    - title: "SaaS platform"
      description: "Hosted documentation service at minimaldoc.dev with multi-tenant architecture."
      status: planned
      version: "v2.0"
      tags: ["saas", "platform"]
    - title: "Plugin architecture"
      description: "Extensible plugin system for custom page types and widgets."
      status: planned
      version: "v2.0"
      tags: ["architecture"]
    - title: "Full-text search"
      description: "Server-side PostgreSQL FTS with instant results and faceted filtering."
      status: planned
      version: "v2.0"
      tags: ["search", "backend"]

