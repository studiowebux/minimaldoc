openapi: "3.0.3"
info:
  title: Petstore API
  description: A sample Pet Store API for demonstrating MinimalDoc's OpenAPI support.
  version: "1.0.0"
  contact:
    name: API Support
    email: support@example.com
servers:
  - url: https://petstore.example.com/api/v1
    description: Production
tags:
  - name: pets
    description: Pet operations
  - name: store
    description: Store operations
paths:
  /pets:
    get:
      tags:
        - pets
      summary: List all pets
      description: Returns all pets from the store inventory.
      operationId: listPets
      parameters:
        - name: limit
          in: query
          description: Maximum number of pets to return
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: status
          in: query
          description: Filter by pet status
          schema:
            type: string
            enum: [available, pending, sold]
      responses:
        "200":
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
        "400":
          description: Invalid parameters
    post:
      tags:
        - pets
      summary: Create a pet
      description: Add a new pet to the store.
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetInput"
      responses:
        "201":
          description: Pet created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          description: Invalid input
  /pets/{petId}:
    get:
      tags:
        - pets
      summary: Get a pet by ID
      description: Returns a single pet by its ID.
      operationId: getPetById
      parameters:
        - name: petId
          in: path
          required: true
          description: The pet ID
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Pet details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          description: Pet not found
    put:
      tags:
        - pets
      summary: Update a pet
      description: Update an existing pet by ID.
      operationId: updatePet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetInput"
      responses:
        "200":
          description: Pet updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          description: Pet not found
    delete:
      tags:
        - pets
      summary: Delete a pet
      description: Remove a pet from the store.
      operationId: deletePet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Pet deleted
        "404":
          description: Pet not found
  /store/inventory:
    get:
      tags:
        - store
      summary: Get inventory
      description: Returns store inventory grouped by status.
      operationId: getInventory
      responses:
        "200":
          description: Inventory counts
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Buddy"
        status:
          type: string
          enum: [available, pending, sold]
          example: "available"
        category:
          type: string
          example: "dog"
        tags:
          type: array
          items:
            type: string
          example: ["friendly", "trained"]
    PetInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "Buddy"
        status:
          type: string
          enum: [available, pending, sold]
        category:
          type: string
        tags:
          type: array
          items:
            type: string
