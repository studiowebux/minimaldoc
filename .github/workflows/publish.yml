name: publish

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  build-go:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            extension: ""
          - platform: linux
            os: ubuntu-latest
            extension: ""
          - platform: windows
            os: windows-latest
            extension: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "^1.24.0"

      - name: Compile minimaldoc
        run: |
          go build -o ./bin/minimaldoc-${{ matrix.platform }}${{ matrix.extension }} ./cmd/minimaldoc

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ./bin/minimaldoc-${{ matrix.platform }}${{ matrix.extension }}
