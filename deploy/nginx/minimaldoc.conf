# MinimalDoc Server - Nginx Configuration
#
# This configuration assumes:
# - Public API on port 8080 (accessible externally)
# - Admin portal on port 8090 (restricted access)
# - TLS certificates from Let's Encrypt or similar
#
# Usage:
# 1. Copy to /etc/nginx/sites-available/minimaldoc.conf
# 2. Create symlink: ln -s /etc/nginx/sites-available/minimaldoc.conf /etc/nginx/sites-enabled/
# 3. Update server_name and ssl_certificate paths
# 4. Test: nginx -t
# 5. Reload: systemctl reload nginx

# Rate limiting zone (optional - app has built-in rate limiting)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=1r/s;

# Upstream servers
upstream minimaldoc_public {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream minimaldoc_admin {
    server 127.0.0.1:8090;
    keepalive 16;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com admin.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Public API (analytics, feedback, newsletter, blog)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;

    # TLS Configuration
    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS (uncomment after confirming HTTPS works)
    # add_header Strict-Transport-Security "max-age=63072000" always;

    # Logging
    access_log /var/log/nginx/minimaldoc_api_access.log;
    error_log /var/log/nginx/minimaldoc_api_error.log;

    # Request size limit (for uploads)
    client_max_body_size 10M;

    # Security headers (app also sets these, but nginx adds defense in depth)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check (no rate limit)
    location = /health {
        proxy_pass http://minimaldoc_public;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Client JS/CSS (cacheable)
    location ~ ^/(minimaldoc\.js|minimaldoc\.css)$ {
        proxy_pass http://minimaldoc_public;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache_valid 200 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Public API endpoints
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://minimaldoc_public;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Deny admin access on public domain
    location /admin {
        return 404;
    }

    # Default: 404
    location / {
        return 404;
    }
}

# Admin Portal (restricted access)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.example.com;

    # TLS Configuration
    ssl_certificate /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS
    # add_header Strict-Transport-Security "max-age=63072000" always;

    # Logging
    access_log /var/log/nginx/minimaldoc_admin_access.log;
    error_log /var/log/nginx/minimaldoc_admin_error.log;

    # Request size limit
    client_max_body_size 10M;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Optional: IP whitelist for admin access
    # Uncomment and adjust to restrict admin to specific IPs/ranges
    # allow 192.168.1.0/24;
    # allow 10.0.0.0/8;
    # deny all;

    # Login endpoint with strict rate limiting
    location = /admin/login {
        limit_req zone=login_limit burst=5 nodelay;

        proxy_pass http://minimaldoc_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;

        proxy_pass http://minimaldoc_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Static files (CSS, JS)
    location /static/ {
        proxy_pass http://minimaldoc_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache_valid 200 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Uploaded files
    location /uploads/ {
        proxy_pass http://minimaldoc_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache_valid 200 24h;
        add_header Cache-Control "public, max-age=86400";
    }

    # Admin UI and API
    location / {
        proxy_pass http://minimaldoc_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
