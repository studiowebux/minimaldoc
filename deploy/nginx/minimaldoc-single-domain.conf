# MinimalDoc Server - Single Domain Configuration
#
# Both public API and admin on same domain:
# - /api/* -> Public API (port 8080)
# - /admin/* -> Admin portal (port 8090, IP restricted)
#
# Simpler setup for small deployments.

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=1r/s;

upstream minimaldoc_public {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream minimaldoc_admin {
    server 127.0.0.1:8090;
    keepalive 16;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;

    # TLS
    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Logging
    access_log /var/log/nginx/minimaldoc_access.log;
    error_log /var/log/nginx/minimaldoc_error.log;

    client_max_body_size 10M;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Health check
    location = /health {
        proxy_pass http://minimaldoc_public;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Client JS/CSS
    location ~ ^/(minimaldoc\.js|minimaldoc\.css)$ {
        proxy_pass http://minimaldoc_public;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=3600";
    }

    # Public API
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://minimaldoc_public;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Admin portal - IP restricted
    location /admin {
        # Restrict to specific IPs (adjust as needed)
        allow 127.0.0.1;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        # allow YOUR_IP_HERE;
        deny all;

        proxy_pass http://minimaldoc_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Admin static files
    location /static/ {
        allow 127.0.0.1;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;

        proxy_pass http://minimaldoc_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=3600";
    }

    # Uploads
    location /uploads/ {
        proxy_pass http://minimaldoc_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        return 404;
    }
}
