<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - MinimalDoc Admin</title>
    <link rel="stylesheet" href="/static/css/admin.css">
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>MinimalDoc</h1>
                <span class="version">Server</span>
            </div>
            <nav class="sidebar-nav">
                <a href="/admin" class="nav-item">
                    <span class="nav-icon">&#9632;</span>
                    Dashboard
                </a>
                <a href="/admin/analytics" class="nav-item">
                    <span class="nav-icon">&#9650;</span>
                    Analytics
                </a>
                <a href="/admin/feedback" class="nav-item active">
                    <span class="nav-icon">&#9733;</span>
                    Feedback
                </a>
                <a href="/admin/subscribers" class="nav-item">
                    <span class="nav-icon">&#9993;</span>
                    Subscribers
                </a>
                <a href="/admin/settings" class="nav-item">
                    <span class="nav-icon">&#9881;</span>
                    Settings
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="/admin/logout" class="nav-item">
                    <span class="nav-icon">&#8594;</span>
                    Logout
                </a>
            </div>
        </aside>
        <main class="main-content">
            <header class="content-header">
                <h2>Feedback</h2>
                {{if .user}}
                <div class="user-info">
                    <span>{{.user.Email}}</span>
                </div>
                {{end}}
            </header>
            <div class="content-body">
                <div class="feedback-page">
                    <div class="stats-grid" id="feedback-stats" hx-get="/admin/fragments/feedback-stats" hx-trigger="load">
                        <div class="stat-card">
                            <div class="stat-value">--</div>
                            <div class="stat-label">Average Rating</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">--</div>
                            <div class="stat-label">Total Feedback</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">--</div>
                            <div class="stat-label">With Comments</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">--</div>
                            <div class="stat-label">This Week</div>
                        </div>
                    </div>

                    <div class="card full-width">
                        <div class="card-header">
                            <h3>Recent Feedback</h3>
                            <div class="card-actions">
                                <select id="rating-filter" hx-get="/admin/fragments/feedback-list" hx-trigger="change" hx-target="#feedback-list" hx-include="this">
                                    <option value="">All Ratings</option>
                                    <option value="5">5 Stars</option>
                                    <option value="4">4 Stars</option>
                                    <option value="3">3 Stars</option>
                                    <option value="2">2 Stars</option>
                                    <option value="1">1 Star</option>
                                </select>
                            </div>
                        </div>
                        <div class="card-body">
                            <div id="feedback-list" hx-get="/admin/fragments/feedback-list" hx-trigger="load">
                                <p class="loading">Loading...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
