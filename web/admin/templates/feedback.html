{{define "feedback.html"}}
<!DOCTYPE html>
<html lang="en">
{{template "head" .}}
<body>
    <div class="admin-layout">
        {{template "sidebar" .}}
        <main class="main-content">
            {{template "content-header" .}}
            <div class="content-body">
                <div class="feedback-page">
                    <div class="stats-grid" id="feedback-stats" hx-get="/admin/fragments/feedback-stats" hx-trigger="load">
                        <div class="stat-card">
                            <div class="stat-value">--</div>
                            <div class="stat-label">Average Rating</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">--</div>
                            <div class="stat-label">Total Feedback</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">--</div>
                            <div class="stat-label">With Comments</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">--</div>
                            <div class="stat-label">This Week</div>
                        </div>
                    </div>

                    <div class="card full-width">
                        <div class="card-header">
                            <h3>Recent Feedback</h3>
                            <div class="card-actions">
                                <select id="rating-filter" hx-get="/admin/fragments/feedback-list" hx-trigger="change" hx-target="#feedback-list" hx-include="this">
                                    <option value="">All Ratings</option>
                                    <option value="5">5 Stars</option>
                                    <option value="4">4 Stars</option>
                                    <option value="3">3 Stars</option>
                                    <option value="2">2 Stars</option>
                                    <option value="1">1 Star</option>
                                </select>
                            </div>
                        </div>
                        <div class="card-body">
                            <div id="feedback-list" hx-get="/admin/fragments/feedback-list" hx-trigger="load">
                                <p class="loading">Loading...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
{{end}}
