{{define "error.html"}}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - MinimalDoc Admin</title>
    <link rel="stylesheet" href="/static/css/admin.css">
    <script src="/static/js/theme-toggle.js"></script>
    <style>
        .error-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-primary);
        }
        .error-container {
            text-align: center;
            max-width: 500px;
            padding: 2rem;
        }
        .error-code {
            font-size: 6rem;
            font-weight: 700;
            color: var(--danger);
            line-height: 1;
            margin-bottom: 1rem;
        }
        .error-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 1rem;
        }
        .error-message {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .error-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
    </style>
</head>
<body class="error-page">
    <div class="error-container">
        <div class="error-code">{{.Code}}</div>
        <h1 class="error-title">{{.Title}}</h1>
        <p class="error-message">{{.Message}}</p>
        <div class="error-actions">
            <a href="/admin" class="btn btn-primary">Go to Dashboard</a>
            <a href="/admin/login" class="btn btn-outline">Login</a>
        </div>
    </div>
</body>
</html>
{{end}}
