{{define "forum-categories.html"}}
<!DOCTYPE html>
<html lang="en">
{{template "head" .}}
<body>
    <div class="admin-layout">
        {{template "sidebar" .}}
        <main class="main-content">
            {{template "content-header" .}}
            <div class="content-body">
                <div class="forum-categories-page">
                    <div class="card">
                        <div class="card-header">
                            <h3>Forum Categories</h3>
                            <div class="card-actions">
                                <button class="btn btn-primary" onclick="showCategoryForm()">New Category</button>
                            </div>
                        </div>
                        <div class="card-body" id="category-list">
                            <p class="loading">Loading...</p>
                        </div>
                    </div>

                    <div id="category-modal" class="modal" style="display: none;">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h3 id="modal-title">New Category</h3>
                                <button class="modal-close" onclick="closeCategoryForm()">&times;</button>
                            </div>
                            <form id="category-form" onsubmit="saveCategory(event)">
                                <input type="hidden" id="category-id" value="">
                                <div class="form-group">
                                    <label for="category-name">Name</label>
                                    <input type="text" id="category-name" name="name" required>
                                </div>
                                <div class="form-group">
                                    <label for="category-slug">Slug</label>
                                    <input type="text" id="category-slug" name="slug" required>
                                </div>
                                <div class="form-group">
                                    <label for="category-description">Description</label>
                                    <textarea id="category-description" name="description" rows="3"></textarea>
                                </div>
                                <div class="form-group">
                                    <label for="category-color">Color</label>
                                    <input type="color" id="category-color" name="color" value="#3b82f6">
                                </div>
                                <div class="form-group">
                                    <label for="category-position">Position</label>
                                    <input type="number" id="category-position" name="position" value="0" min="0">
                                </div>
                                <div class="form-group">
                                    <label>
                                        <input type="checkbox" id="category-locked" name="is_locked">
                                        Locked (no new topics)
                                    </label>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" onclick="closeCategoryForm()">Cancel</button>
                                    <button type="submit" class="btn btn-primary">Save</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script nonce="{{.Nonce}}">
        async function loadCategories() {
            try {
                const res = await fetch('/api/forum/categories');
                const data = await res.json();
                renderCategories(data.categories || []);
            } catch (e) {
                document.getElementById('category-list').innerHTML = '<p class="error">Failed to load categories</p>';
            }
        }

        function renderCategories(categories) {
            if (!categories.length) {
                document.getElementById('category-list').innerHTML = '<p>No categories yet.</p>';
                return;
            }
            let html = '<table class="data-table"><thead><tr><th>Name</th><th>Slug</th><th>Topics</th><th>Status</th><th>Actions</th></tr></thead><tbody>';
            for (const cat of categories) {
                html += `<tr>
                    <td><span style="color: ${cat.Color || '#3b82f6'}">&#9632;</span> ${escapeHtml(cat.Name)}</td>
                    <td><code>${escapeHtml(cat.Slug)}</code></td>
                    <td>${cat.TopicCount || 0}</td>
                    <td>${cat.IsLocked ? '<span class="badge badge-warning">Locked</span>' : '<span class="badge badge-success">Open</span>'}</td>
                    <td>
                        <button class="btn btn-sm btn-secondary" onclick="editCategory('${cat.ID}')">Edit</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteCategory('${cat.ID}')">Delete</button>
                    </td>
                </tr>`;
            }
            html += '</tbody></table>';
            document.getElementById('category-list').innerHTML = html;
        }

        function showCategoryForm(category = null) {
            document.getElementById('modal-title').textContent = category ? 'Edit Category' : 'New Category';
            document.getElementById('category-id').value = category?.ID || '';
            document.getElementById('category-name').value = category?.Name || '';
            document.getElementById('category-slug').value = category?.Slug || '';
            document.getElementById('category-description').value = category?.Description || '';
            document.getElementById('category-color').value = category?.Color || '#3b82f6';
            document.getElementById('category-position').value = category?.Position || 0;
            document.getElementById('category-locked').checked = category?.IsLocked || false;
            document.getElementById('category-modal').style.display = 'flex';
        }

        function closeCategoryForm() {
            document.getElementById('category-modal').style.display = 'none';
        }

        async function editCategory(id) {
            try {
                const res = await fetch('/api/forum/categories/' + id);
                const data = await res.json();
                showCategoryForm(data.category);
            } catch (e) {
                alert('Failed to load category');
            }
        }

        async function saveCategory(e) {
            e.preventDefault();
            const id = document.getElementById('category-id').value;
            const data = {
                name: document.getElementById('category-name').value,
                slug: document.getElementById('category-slug').value,
                description: document.getElementById('category-description').value,
                color: document.getElementById('category-color').value,
                position: parseInt(document.getElementById('category-position').value) || 0,
                is_locked: document.getElementById('category-locked').checked
            };
            try {
                const method = id ? 'PUT' : 'POST';
                const url = id ? '/api/forum/categories/' + id : '/api/forum/categories';
                const res = await fetch(url, {
                    method,
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                if (!res.ok) throw new Error('Failed');
                closeCategoryForm();
                loadCategories();
            } catch (e) {
                alert('Failed to save category');
            }
        }

        async function deleteCategory(id) {
            if (!confirm('Delete this category? All topics will be deleted.')) return;
            try {
                const res = await fetch('/api/forum/categories/' + id, {method: 'DELETE'});
                if (!res.ok) throw new Error('Failed');
                loadCategories();
            } catch (e) {
                alert('Failed to delete category');
            }
        }

        function escapeHtml(s) {
            const div = document.createElement('div');
            div.textContent = s;
            return div.innerHTML;
        }

        loadCategories();
    </script>
</body>
</html>
{{end}}
