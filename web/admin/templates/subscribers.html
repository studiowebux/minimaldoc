<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscribers - MinimalDoc Admin</title>
    <link rel="stylesheet" href="/static/css/admin.css">
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>MinimalDoc</h1>
                <span class="version">Server</span>
            </div>
            <nav class="sidebar-nav">
                <a href="/admin" class="nav-item">
                    <span class="nav-icon">&#9632;</span>
                    Dashboard
                </a>
                <a href="/admin/analytics" class="nav-item">
                    <span class="nav-icon">&#9650;</span>
                    Analytics
                </a>
                <a href="/admin/feedback" class="nav-item">
                    <span class="nav-icon">&#9733;</span>
                    Feedback
                </a>
                <a href="/admin/subscribers" class="nav-item active">
                    <span class="nav-icon">&#9993;</span>
                    Subscribers
                </a>
                <a href="/admin/settings" class="nav-item">
                    <span class="nav-icon">&#9881;</span>
                    Settings
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="/admin/logout" class="nav-item">
                    <span class="nav-icon">&#8594;</span>
                    Logout
                </a>
            </div>
        </aside>
        <main class="main-content">
            <header class="content-header">
                <h2>Subscribers</h2>
                {{if .user}}
                <div class="user-info">
                    <span>{{.user.Email}}</span>
                </div>
                {{end}}
            </header>
            <div class="content-body">
                <div class="subscribers-page">
                    <div class="page-actions">
                        <a href="/admin/subscribers/export" class="btn btn-primary">Export CSV</a>
                    </div>

                    <div class="stats-grid" id="subscriber-stats" hx-get="/admin/fragments/subscriber-stats" hx-trigger="load">
                        <div class="stat-card">
                            <div class="stat-value">--</div>
                            <div class="stat-label">Total Subscribers</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">--</div>
                            <div class="stat-label">Verified</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">--</div>
                            <div class="stat-label">Pending</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">--</div>
                            <div class="stat-label">This Month</div>
                        </div>
                    </div>

                    <div class="card full-width">
                        <div class="card-header">
                            <h3>Subscriber List</h3>
                            <div class="card-actions">
                                <select id="status-filter" hx-get="/admin/fragments/subscriber-list" hx-trigger="change" hx-target="#subscriber-list" hx-include="this">
                                    <option value="">All</option>
                                    <option value="verified">Verified</option>
                                    <option value="pending">Pending</option>
                                </select>
                            </div>
                        </div>
                        <div class="card-body">
                            <div id="subscriber-list" hx-get="/admin/fragments/subscriber-list" hx-trigger="load">
                                <p class="loading">Loading...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
