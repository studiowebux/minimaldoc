{{define "forum-tags.html"}}
<!DOCTYPE html>
<html lang="en">
{{template "head" .}}
<body>
    <div class="admin-layout">
        {{template "sidebar" .}}
        <main class="main-content">
            {{template "content-header" .}}
            <div class="content-body">
                <div class="forum-tags-page">
                    <div class="card">
                        <div class="card-header">
                            <h3>Forum Tags</h3>
                            <div class="card-actions">
                                <button class="btn btn-primary" onclick="showTagForm()">New Tag</button>
                            </div>
                        </div>
                        <div class="card-body" id="tag-list">
                            <p class="loading">Loading...</p>
                        </div>
                    </div>

                    <div id="tag-modal" class="modal" style="display: none;">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h3 id="modal-title">New Tag</h3>
                                <button class="modal-close" onclick="closeTagForm()">&times;</button>
                            </div>
                            <form id="tag-form" onsubmit="saveTag(event)">
                                <input type="hidden" id="tag-id" value="">
                                <div class="form-group">
                                    <label for="tag-name">Name</label>
                                    <input type="text" id="tag-name" name="name" required>
                                </div>
                                <div class="form-group">
                                    <label for="tag-slug">Slug</label>
                                    <input type="text" id="tag-slug" name="slug" required>
                                </div>
                                <div class="form-group">
                                    <label for="tag-description">Description</label>
                                    <textarea id="tag-description" name="description" rows="2"></textarea>
                                </div>
                                <div class="form-group">
                                    <label for="tag-color">Color</label>
                                    <input type="color" id="tag-color" name="color" value="#6b7280">
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" onclick="closeTagForm()">Cancel</button>
                                    <button type="submit" class="btn btn-primary">Save</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script nonce="{{.Nonce}}">
        async function loadTags() {
            try {
                const res = await fetch('/api/forum/tags');
                const data = await res.json();
                renderTags(data.tags || []);
            } catch (e) {
                document.getElementById('tag-list').innerHTML = '<p class="error">Failed to load tags</p>';
            }
        }

        function renderTags(tags) {
            if (!tags.length) {
                document.getElementById('tag-list').innerHTML = '<p>No tags yet.</p>';
                return;
            }
            let html = '<div class="tags-grid">';
            for (const tag of tags) {
                html += `<div class="tag-card" style="border-left: 4px solid ${tag.Color || '#6b7280'}">
                    <div class="tag-header">
                        <span class="tag-name">${escapeHtml(tag.Name)}</span>
                        <span class="tag-count">${tag.UsageCount || 0} topics</span>
                    </div>
                    <div class="tag-slug"><code>${escapeHtml(tag.Slug)}</code></div>
                    ${tag.Description?.Valid ? `<div class="tag-desc">${escapeHtml(tag.Description.String)}</div>` : ''}
                    <div class="tag-actions">
                        <button class="btn btn-sm btn-secondary" data-action="edit-tag" data-id="${escapeHtml(tag.ID)}">Edit</button>
                        <button class="btn btn-sm btn-danger" data-action="delete-tag" data-id="${escapeHtml(tag.ID)}">Delete</button>
                    </div>
                </div>`;
            }
            html += '</div>';
            document.getElementById('tag-list').innerHTML = html;
        }

        function showTagForm(tag = null) {
            document.getElementById('modal-title').textContent = tag ? 'Edit Tag' : 'New Tag';
            document.getElementById('tag-id').value = tag?.ID || '';
            document.getElementById('tag-name').value = tag?.Name || '';
            document.getElementById('tag-slug').value = tag?.Slug || '';
            document.getElementById('tag-description').value = tag?.Description?.String || '';
            document.getElementById('tag-color').value = tag?.Color || '#6b7280';
            document.getElementById('tag-modal').style.display = 'flex';
        }

        function closeTagForm() {
            document.getElementById('tag-modal').style.display = 'none';
        }

        async function editTag(id) {
            try {
                const res = await fetch('/api/forum/tags/' + id);
                const data = await res.json();
                showTagForm(data.tag);
            } catch (e) {
                alert('Failed to load tag');
            }
        }

        async function saveTag(e) {
            e.preventDefault();
            const id = document.getElementById('tag-id').value;
            const data = {
                name: document.getElementById('tag-name').value,
                slug: document.getElementById('tag-slug').value,
                description: document.getElementById('tag-description').value,
                color: document.getElementById('tag-color').value
            };
            try {
                const method = id ? 'PUT' : 'POST';
                const url = id ? '/api/forum/tags/' + id : '/api/forum/tags';
                const res = await fetch(url, {
                    method,
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                if (!res.ok) throw new Error('Failed');
                closeTagForm();
                loadTags();
            } catch (e) {
                alert('Failed to save tag');
            }
        }

        async function deleteTag(id) {
            if (!confirm('Delete this tag?')) return;
            try {
                const res = await fetch('/api/forum/tags/' + id, {method: 'DELETE'});
                if (!res.ok) throw new Error('Failed');
                loadTags();
            } catch (e) {
                alert('Failed to delete tag');
            }
        }

        document.addEventListener('click', function(e) {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;
            const action = btn.getAttribute('data-action');
            const id = btn.getAttribute('data-id');
            if (action === 'edit-tag') editTag(id);
            else if (action === 'delete-tag') deleteTag(id);
        });

        loadTags();
    </script>
</body>
</html>
{{end}}
