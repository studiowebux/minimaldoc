<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - MinimalDoc Admin</title>
    <link rel="stylesheet" href="/static/css/admin.css">
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>MinimalDoc</h1>
                <span class="version">Server</span>
            </div>
            <nav class="sidebar-nav">
                <a href="/admin" class="nav-item">
                    <span class="nav-icon">&#9632;</span>
                    Dashboard
                </a>
                <a href="/admin/analytics" class="nav-item active">
                    <span class="nav-icon">&#9650;</span>
                    Analytics
                </a>
                <a href="/admin/feedback" class="nav-item">
                    <span class="nav-icon">&#9733;</span>
                    Feedback
                </a>
                <a href="/admin/subscribers" class="nav-item">
                    <span class="nav-icon">&#9993;</span>
                    Subscribers
                </a>
                <a href="/admin/settings" class="nav-item">
                    <span class="nav-icon">&#9881;</span>
                    Settings
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="/admin/logout" class="nav-item">
                    <span class="nav-icon">&#8594;</span>
                    Logout
                </a>
            </div>
        </aside>
        <main class="main-content">
            <header class="content-header">
                <h2>Analytics</h2>
                {{if .user}}
                <div class="user-info">
                    <span>{{.user.Email}}</span>
                </div>
                {{end}}
            </header>
            <div class="content-body">
                <div class="analytics-page">
                    <div class="page-actions">
                        <div class="date-filter">
                            <select id="period-select" hx-get="/admin/fragments/analytics-stats" hx-trigger="change" hx-target="#stats-container" hx-include="this">
                                <option value="24h">Last 24 hours</option>
                                <option value="7d" selected>Last 7 days</option>
                                <option value="30d">Last 30 days</option>
                            </select>
                        </div>
                    </div>

                    <div id="stats-container" class="stats-grid" hx-get="/admin/fragments/analytics-stats?period=7d" hx-trigger="load">
                        <div class="stat-card">
                            <div class="stat-value">--</div>
                            <div class="stat-label">Page Views</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">--</div>
                            <div class="stat-label">Unique Visitors</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">--</div>
                            <div class="stat-label">Avg. Time on Page</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">--</div>
                            <div class="stat-label">Bounce Rate</div>
                        </div>
                    </div>

                    <div class="dashboard-row">
                        <div class="card">
                            <div class="card-header">
                                <h3>Top Pages</h3>
                            </div>
                            <div class="card-body" id="top-pages" hx-get="/admin/fragments/top-pages?period=7d" hx-trigger="load">
                                <p class="loading">Loading...</p>
                            </div>
                        </div>

                        <div class="card">
                            <div class="card-header">
                                <h3>Traffic Sources</h3>
                            </div>
                            <div class="card-body" id="traffic-sources" hx-get="/admin/fragments/traffic-sources?period=7d" hx-trigger="load">
                                <p class="loading">Loading...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script>
    document.getElementById('period-select').addEventListener('change', function() {
        var period = this.value;
        htmx.ajax('GET', '/admin/fragments/top-pages?period=' + period, '#top-pages');
        htmx.ajax('GET', '/admin/fragments/traffic-sources?period=' + period, '#traffic-sources');
    });
    </script>
</body>
</html>
