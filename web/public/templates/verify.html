{{define "verify.html"}}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification</title>
    <link rel="stylesheet" href="/theme/css/tokens.css">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
    <div class="verify-container">
        {{if .success}}
        <div class="icon icon-success">&#10003;</div>
        <h1>Email Verified</h1>
        <p>Your email has been verified successfully. You can now sign in.</p>
        <a href="/login?site_id={{.site_id}}" class="btn">Sign In</a>
        {{else}}
        <div class="icon icon-error">&#10007;</div>
        <h1>Verification Failed</h1>
        <p>{{.error}}</p>
        <a href="/login?site_id={{.site_id}}" class="btn">Go to Login</a>
        {{end}}
    </div>
</body>
</html>
{{end}}
