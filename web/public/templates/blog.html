{{define "blog.html"}}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | {{.site_name}}</title>
    <link rel="stylesheet" href="/theme/css/tokens.css">
    <link rel="stylesheet" href="/static/css/public.css">
    <script src="/static/js/htmx.min.js"></script>
</head>
<body>
    {{template "header" .}}

    <section class="blog-hero">
        <h1>Blog</h1>
        <p>Latest news and updates</p>
        <div class="blog-search">
            <input type="text" id="blog-search" name="q" placeholder="Search posts..." autocomplete="off"
                   hx-get="/api/blog/fragments/search"
                   hx-trigger="input changed delay:300ms"
                   hx-target="#blog-search-dropdown">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
            </svg>
            <div id="blog-search-dropdown" class="blog-search-dropdown"></div>
        </div>
    </section>

    <section class="blog-content">
        <div class="blog-grid" id="blog-posts"
             hx-get="/api/blog/fragments/posts"
             hx-trigger="load">
            <div class="blog-loading">Loading posts...</div>
        </div>
    </section>

    {{template "footer"}}

    <script>
        document.getElementById('blog-search').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                var query = this.value.trim();
                var url = '/api/blog/fragments/posts' + (query ? '?q=' + encodeURIComponent(query) : '');
                htmx.ajax('GET', url, {target: '#blog-posts', swap: 'innerHTML'});
                document.getElementById('blog-search-dropdown').innerHTML = '';
            }
        });
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.blog-search')) {
                document.getElementById('blog-search-dropdown').innerHTML = '';
            }
        });
    </script>
</body>
</html>
{{end}}
