{{define "forum-new.html"}}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Topic | {{.site_name}}</title>
    <link rel="stylesheet" href="/theme/css/tokens.css">
    <link rel="stylesheet" href="/static/css/public.css">
    <script src="/static/js/htmx.min.js"></script>
</head>
<body>
    {{template "header" .}}

    <section class="forum-hero">
        <h1>Start a Discussion</h1>
        <p>Share your thoughts with the community</p>
    </section>

    <section class="forum-content">
        <div class="forum-new-topic-form">
            <form id="new-topic-form" hx-post="/api/forum/topics" hx-ext="json-enc" hx-target="#form-result">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" required placeholder="Enter a descriptive title" maxlength="200">
                </div>

                <div class="form-group">
                    <label for="category_id">Category</label>
                    <select id="category_id" name="category_id" required>
                        <option value="">Select a category</option>
                        {{range .categories}}
                        <option value="{{.ID}}">{{.Name}}</option>
                        {{end}}
                    </select>
                </div>

                <div class="form-group">
                    <label for="content">Content</label>
                    <textarea id="content" name="content" required rows="10" placeholder="Write your post content here..."></textarea>
                </div>

                <div class="form-group">
                    <label for="tags">Tags (comma-separated)</label>
                    <input type="text" id="tags" name="tags" placeholder="e.g. help, question, feature">
                </div>

                <div id="form-result"></div>

                <div class="form-actions">
                    <a href="/forum/" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Create Topic</button>
                </div>
            </form>
        </div>
    </section>

    {{template "footer"}}

    <script src="/static/js/htmx-json-enc.js"></script>
    <script nonce="{{.Nonce}}">
        document.body.addEventListener('htmx:afterRequest', function(evt) {
            var resultDiv = document.getElementById('form-result');
            if (evt.detail.successful && evt.detail.xhr.status === 201) {
                var response = JSON.parse(evt.detail.xhr.responseText);
                if (response.slug) {
                    window.location.href = '/forum/topic/' + response.slug;
                } else if (response.message) {
                    resultDiv.innerHTML = '<div class="form-success">' + response.message + '</div>';
                    document.getElementById('new-topic-form').reset();
                } else {
                    window.location.href = '/forum/';
                }
            } else if (evt.detail.xhr && evt.detail.xhr.status >= 400) {
                try {
                    var response = JSON.parse(evt.detail.xhr.responseText);
                    resultDiv.innerHTML = '<div class="form-error">' + (response.error || 'An error occurred') + '</div>';
                } catch (e) {
                    resultDiv.innerHTML = '<div class="form-error">An error occurred</div>';
                }
            }
        });
    </script>
</body>
</html>
{{end}}
