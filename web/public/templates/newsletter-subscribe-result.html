{{define "newsletter-subscribe-result.html"}}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter Subscription</title>
    <style>
        :root {
            --bg-color: #f5f5f5;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-muted: #666666;
            --success-color: #16a34a;
            --error-color: #dc2626;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .result-container {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .result-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .result-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .result-message {
            color: var(--text-muted);
            font-size: 0.9375rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }
        .result-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.8125rem;
            font-weight: 500;
            margin-bottom: 1rem;
        }
        .badge-success {
            background: #dcfce7;
            color: var(--success-color);
        }
        .badge-error {
            background: #fef2f2;
            color: var(--error-color);
        }
        .result-link {
            display: inline-block;
            color: var(--text-muted);
            font-size: 0.875rem;
            text-decoration: none;
        }
        .result-link:hover {
            color: var(--text-color);
        }
    </style>
</head>
<body>
    <div class="result-container">
    {{if .success}}
        <div class="result-icon">&#10003;</div>
        <h1 class="result-title">You're subscribed</h1>
        <span class="result-badge badge-success">Verified via {{.provider}}</span>
        <p class="result-message">{{.email}} has been added to the newsletter. No verification email needed.</p>
    {{else}}
        <div class="result-icon">&#10007;</div>
        <h1 class="result-title">Subscription failed</h1>
        <span class="result-badge badge-error">Error</span>
        <p class="result-message">{{.error}}</p>
    {{end}}
        <a href="/" class="result-link">Back to home</a>
    </div>
</body>
</html>
{{end}}
